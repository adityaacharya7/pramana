server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 26m;

  # Same path layout as the Vite dev proxy: the browser only ever talks to
  # this origin, so no CORS and nothing leaves the machine.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
